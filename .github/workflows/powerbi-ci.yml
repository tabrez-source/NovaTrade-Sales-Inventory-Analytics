name: Power BI CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "powerbi/**"
      - "scripts/qa/**"
      - "scripts/powerbi/**"
      - ".github/workflows/powerbi-ci.yml"
  push:
    branches:
      - main
    paths:
      - "powerbi/**"
      - "scripts/qa/**"
      - "scripts/powerbi/**"
      - ".github/workflows/powerbi-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: powerbi-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate PBIP sources
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check changed-file formatting
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          zero_sha="0000000000000000000000000000000000000000"
          checked_paths=(
            ":(glob).github/workflows/*.yml"
            ":(glob).github/workflows/*.yaml"
            ":(glob)scripts/qa/*.mjs"
            ":(glob)scripts/powerbi/*.mjs"
          )

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA...$HEAD_SHA" -- "${checked_paths[@]}"
          elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "$zero_sha" ]]; then
            git diff --check "$BEFORE_SHA..$HEAD_SHA" -- "${checked_paths[@]}"
          else
            git diff-tree --check --root -r "$HEAD_SHA" -- "${checked_paths[@]}"
          fi

      - name: Validate PBIP repository structure
        run: node scripts/qa/validate-pbip-repository.mjs .

      - name: Validate Executive checkpoint
        run: node scripts/qa/validate-executive-checkpoint.mjs . --no-write

      - name: Validate Sales Performance checkpoint
        run: node scripts/qa/validate-sales-checkpoint.mjs .

      - name: Validate Product Performance checkpoint
        run: node scripts/qa/validate-product-checkpoint.mjs .

      - name: Validate Inventory Operations checkpoint
        run: node scripts/qa/validate-inventory-checkpoint.mjs .

      - name: Validate Management Insights checkpoint
        run: node scripts/qa/validate-management-checkpoint.mjs .

      - name: Validate report governance checkpoint
        run: node scripts/qa/validate-governance-checkpoint.mjs .

      - name: Validate final report polish checkpoint
        run: node scripts/qa/validate-final-polish-checkpoint.mjs .
